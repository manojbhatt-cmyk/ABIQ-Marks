[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiq-marks"
version = "0.1.0"
description = "ABIQ Marks POC: AllianceBernstein Private Credit marks process as one governed workflow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "pillow>=10.0",
  "duckdb>=1.0",
  "snowflake-connector-python>=3.10",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
synth = "synth.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]
include = ["domain*", "connectors*", "pipeline*", "agents*", "synth*", "evals*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
