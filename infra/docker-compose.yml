name: tiq-marks

# One command to run the POC: `docker compose -f infra/docker-compose.yml up`.
# Postgres (with pgvector) is the app database. The API and web app can run in
# containers (profile "app") or on the host for development; both read the same
# environment variables from ../.env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tiq
      POSTGRES_PASSWORD: tiq
      POSTGRES_DB: tiq
    ports:
      - "5432:5432"
    volumes:
      - tiq_marks_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiq -d tiq"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The API runs in Linux even on a Windows laptop: Windows Application Control blocks the compiled
  # parts of SQLAlchemy, psycopg and the Snowflake connector. The repo is mounted at /app, so code
  # changes, local-data and .env are shared with the host; config.py reads /app/.env itself.
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tiq:tiq@postgres:5432/tiq
      TEST_DATABASE_URL: postgresql+psycopg://tiq:tiq@postgres:5432/tiq_test
      SNOWFLAKE_PRIVATE_KEY_FILE: /app/.secrets/snowflake/tiq_service_key.p8
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ../apps/web
      dockerfile: ../../infra/web.Dockerfile
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  tiq_marks_pg:
